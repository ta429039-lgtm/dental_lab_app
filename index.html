<style>
  body { margin: 0; }
  * { box-sizing: border-box; }
  input::placeholder { color: #5c6b8a; }

  .eu-card { transition: border-color .18s ease, background-color .18s ease, transform .15s ease; cursor: pointer; }
  .eu-card:hover { transform: translateY(-2px); }
  .eu-close:hover { background: rgba(255,255,255,0.08); }
  .eu-option:hover { background: rgba(53,197,201,0.16) !important; }
  table { border-collapse: collapse; }
  th { text-align: right; }
  .eu-hidden { display: none !important; }

  .eu-enter-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 17px 42px; border-radius: 999px;
    background: linear-gradient(135deg, #35c5c9, #2196a3);
    color: #04141a; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 16px;
    text-decoration: none; letter-spacing: .2px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.14), 0 12px 34px rgba(53,197,201,0.35);
    transition: transform .18s ease, box-shadow .18s ease;
    border: none; cursor: pointer;
  }
  .eu-enter-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 16px 40px rgba(53,197,201,0.5);
  }
  .eu-enter-btn svg { transition: transform .18s ease; }
  .eu-enter-btn:hover svg { transform: translateX(-3px); }

  .eu-landing-logo { width: 220px; max-width: 60vw; filter: drop-shadow(0 18px 46px rgba(53,197,201,0.22)); animation: eu-float 7s ease-in-out infinite; }
  @media (max-width: 480px) { .eu-landing-logo { width: 170px; } }

  .eu-starfield {
    background-image:
      radial-gradient(1.6px 1.6px at 20px 30px, rgba(255,255,255,0.85), transparent 60%),
      radial-gradient(1.2px 1.2px at 95px 65px, rgba(255,255,255,0.65), transparent 60%),
      radial-gradient(1.4px 1.4px at 150px 15px, rgba(255,255,255,0.55), transparent 60%),
      radial-gradient(1.6px 1.6px at 55px 130px, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1.2px 1.2px at 180px 155px, rgba(255,255,255,0.75), transparent 60%),
      radial-gradient(2px 2px at 120px 95px, rgba(180,210,255,0.55), transparent 60%),
      radial-gradient(1.2px 1.2px at 10px 175px, rgba(255,255,255,0.45), transparent 60%),
      radial-gradient(1.4px 1.4px at 200px 90px, rgba(255,255,255,0.6), transparent 60%);
    background-repeat: repeat;
    background-size: 220px 220px;
    animation: eu-drift 140s linear infinite;
  }
  .eu-starfield-bright {
    position: absolute; inset: -20px;
    background-image:
      radial-gradient(2.4px 2.4px at 60px 60px, rgba(255,255,255,0.9), transparent 65%),
      radial-gradient(2px 2px at 260px 140px, rgba(200,225,255,0.75), transparent 65%),
      radial-gradient(2.6px 2.6px at 420px 40px, rgba(255,255,255,0.8), transparent 65%),
      radial-gradient(2px 2px at 340px 260px, rgba(180,210,255,0.7), transparent 65%),
      radial-gradient(2.2px 2.2px at 120px 300px, rgba(255,255,255,0.7), transparent 65%);
    background-repeat: repeat;
    background-size: 480px 480px;
    animation: eu-twinkle-a 5s ease-in-out infinite;
  }
  .eu-starfield-glow {
    position: absolute; inset: -20px;
    background-image:
      radial-gradient(3.2px 3.2px at 140px 90px, rgba(255,255,255,0.95), transparent 70%),
      radial-gradient(2.8px 2.8px at 380px 220px, rgba(150,235,235,0.85), transparent 70%),
      radial-gradient(3px 3px at 540px 70px, rgba(255,255,255,0.9), transparent 70%),
      radial-gradient(2.6px 2.6px at 620px 300px, rgba(180,210,255,0.8), transparent 70%);
    background-repeat: repeat;
    background-size: 640px 640px;
    animation: eu-twinkle-b 3.4s ease-in-out infinite;
  }
  .eu-nebula {
    position: absolute; border-radius: 50%; pointer-events: none; filter: blur(2px);
    animation: eu-nebula 9s ease-in-out infinite;
  }
  .eu-nebula.n1 { width: 420px; height: 420px; top: -140px; right: 8%; background: radial-gradient(circle, rgba(53,197,201,0.20), rgba(53,197,201,0) 70%); }
  .eu-nebula.n2 { width: 380px; height: 380px; top: 60px; left: 4%; background: radial-gradient(circle, rgba(120,110,220,0.16), rgba(120,110,220,0) 70%); animation-delay: 2.5s; }
  @keyframes eu-twinkle-a { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @keyframes eu-twinkle-b { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
  @keyframes eu-drift { 0% { background-position: 0 0; } 100% { background-position: -220px 220px; } }
  @keyframes eu-nebula { 0%, 100% { transform: translate(0,0) scale(1); opacity: .8; } 50% { transform: translate(-14px,10px) scale(1.1); opacity: 1; } }
  .eu-shoot {
    position: absolute;
    width: 150px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95) 45%, rgba(255,255,255,0));
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.55));
    opacity: 0;
    animation: eu-shoot 7s ease-in infinite;
  }
  @keyframes eu-shoot {
    0%   { transform: translate(0,0) rotate(-35deg); opacity: 0; }
    3%   { opacity: 1; }
    22%  { opacity: 0; }
    100% { transform: translate(-260px,180px) rotate(-35deg); opacity: 0; }
  }
  .eu-shoot.s1 { top: 10%; right: 62%; animation-delay: .3s; }
  .eu-shoot.s2 { top: 2%;  right: 22%; animation-delay: 3.1s; }
  .eu-shoot.s3 { top: 22%; right: 80%; animation-delay: 5.6s; animation-duration: 8s; }
  .eu-shoot.s4 { top: -2%; right: 42%; animation-delay: 1.9s; animation-duration: 9s; }
  .eu-shoot.s5 { top: 16%; right: 12%; animation-delay: 4.4s; animation-duration: 6.4s; width: 110px; }
  .eu-shoot.s6 { top: 30%; right: 55%; animation-delay: 7.2s; animation-duration: 10s; width: 120px; }
  .eu-logo-float { animation: eu-float 7s ease-in-out infinite; }
  @keyframes eu-float { 0%, 100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-52%) scale(1.015); } }

  /* ---------- Mobile responsiveness ---------- */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  input[type="text"], input[type="number"], input[type="date"] { font-size: 16px !important; } /* prevents iOS auto-zoom on focus */
  button { touch-action: manipulation; }
  @media (max-width: 720px) {

  }

  @media (max-width: 720px) {
    .eu-hero-inner { padding: 40px 18px 26px !important; gap: 18px !important; }
    .eu-hero-logo { width: 96px !important; height: 96px !important; }
    .eu-hero-logo img { width: 72px !important; height: 72px !important; }
    .eu-hero-title { font-size: 26px !important; }
    .eu-main-wrap { padding: 8px 14px 60px !important; gap: 28px !important; }
    .eu-section-title { font-size: 17px !important; }
    .eu-cases-grid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 10px !important; }
    .eu-finance-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
    .eu-card { padding: 16px !important; min-height: 108px !important; }
    .eu-card-icon { width: 34px !important; height: 34px !important; }
    .eu-card-count { font-size: 21px !important; }
    .eu-card-label { font-size: 12.5px !important; }
    .eu-toolbar-btn { flex: 1 1 auto !important; justify-content: center !important; padding: 13px 14px !important; font-size: 13px !important; }
    table { font-size: 13px !important; }
    th, td { padding: 12px 14px !important; }
    .eu-modal-box { padding: 18px !important; max-width: 100% !important; }
    .eu-search-wrap { flex: 1 1 100% !important; min-width: 0 !important; }
    .eu-date-chip { flex: 1 1 100% !important; justify-content: center !important; }
  }

  @media (max-width: 460px) {
    .eu-cases-grid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 8px !important; }
    .eu-card { padding: 14px !important; min-height: 96px !important; gap: 10px !important; }
    .eu-card-count { font-size: 19px !important; }
    .eu-hero-title { font-size: 22px !important; }
    .eu-form-grid { grid-template-columns: 1fr !important; }
  }
</style>

  App.prototype.checkStorageAvailable = function () {

  App.prototype.loadData = function () {
    if (!this.storageAvailable) return;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;

      this.lateRows = Array.isArray(data.lateRows) ? data.lateRows : [];
      this.progressRows = Array.isArray(data.progressRows) ? data.progressRows : [];
      this.completedRows = Array.isArray(data.completedRows) ? data.completedRows : [];
      this.deliveredRows = Array.isArray(data.deliveredRows) ? data.deliveredRows : [];
      this.pendingRows = Array.isArray(data.pendingRows) ? data.pendingRows : [];
      this.materialsRows = Array.isArray(data.materialsRows) ? data.materialsRows : [];

      this.idCounter = Number(data.idCounter) || 0;
      this.materialsIdCounter = Number(data.materialsIdCounter) || 0;

      this.notifiedOverdueIds = new Set(Array.isArray(data.notifiedOverdueIds) ? data.notifiedOverdueIds : []);
      this.notifiedLowStockIds = new Set(Array.isArray(data.notifiedLowStockIds) ? data.notifiedLowStockIds : []);
    } catch (e) {
      /* corrupted or inaccessible storage: keep working with empty in-memory data */
    }
  };

  App.prototype.saveData = function () {
    if (!this.storageAvailable) return;
    try {
      var payload = {
        lateRows: this.lateRows,
        progressRows: this.progressRows,
        completedRows: this.completedRows,
        deliveredRows: this.deliveredRows,
        pendingRows: this.pendingRows,
        materialsRows: this.materialsRows,
        idCounter: this.idCounter,
        materialsIdCounter: this.materialsIdCounter,
        notifiedOverdueIds: Array.from(this.notifiedOverdueIds),
        notifiedLowStockIds: Array.from(this.notifiedLowStockIds)

      /* storage full or unavailable: fail silently, keep the app usable in-memory */

  App.prototype.isStandalone = function () {

  App.prototype.setupPwa = function () {
    var self = this;

       via the manifest + beforeinstallprompt handling below. */
    try {

        e.preventDefault();

        self.render();
      });
      window.addEventListener('appinstalled', function () {

        self.setState({ installDismissed: true });
      });
    } catch (e) {}
  };

  App.prototype.installClick = function () {
    var self = this;
    if (this.deferredPrompt) {
      var prompt = this.deferredPrompt;
      this.deferredPrompt = null;
      prompt.prompt();
      if (prompt.userChoice && prompt.userChoice.finally) {
        prompt.userChoice.finally(function () { self.render(); });
      }
    } else {
      this.setState({ installInstructionsOpen: true });
    }
  };

  App.prototype.requestNotificationPermission = function () {
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
        Notification.requestPermission().catch(function () {});
      }
    } catch (e) {}
  };

  App.prototype.sendBrowserNotification = function (title, body) {
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        new Notification(title, { body: body });
      }
    } catch (e) {}
  };

  App.prototype.playAlertSound = function () {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.55);
    } catch (e) {}
  };

  App.prototype.dismissAlert = function (id) {
    this.setState({ alerts: (this.state.alerts || []).filter(function (a) { return a.id !== id; }) });
  };

  App.prototype.checkAlerts = function () {
    var self = this;
    var todayStr = new Date().toISOString().slice(0, 10);
    var sources = {
      late: this.lateRows, inprogress: this.progressRows, completed: this.completedRows,
      delivered: this.deliveredRows, pending: this.pendingRows
    };
    var newAlerts = [];
    Object.keys(sources).forEach(function (statusId) {
      if (statusId === 'delivered') return;
      sources[statusId].forEach(function (r) {
        var due = r.dueDate || r.expected || '';
        if (due && due < todayStr && !self.notifiedOverdueIds.has(r.id)) {
          self.notifiedOverdueIds.add(r.id);
          var text = 'حالة متأخرة: ' + (r.doctor || '—') + ' — المريض ' + (r.patient || '—');
          newAlerts.push({ text: text, kind: 'overdue' });
          self.sendBrowserNotification('حالة متأخرة', text);
        }
      });
    });
    this.materialsRows.forEach(function (m) {
      if ((Number(m.qty) || 0) <= LOW_STOCK_THRESHOLD && !self.notifiedLowStockIds.has(m.id)) {
        self.notifiedLowStockIds.add(m.id);
        var text = 'المادة "' + m.name + '" أوشكت على النفاد (الكمية المتبقية: ' + m.qty + ')';
        newAlerts.push({ text: text, kind: 'stock' });
        self.sendBrowserNotification('تنبيه مخزون', text);
      }
    });
    if (newAlerts.length) {
      this.playAlertSound();
      var withIds = newAlerts.map(function (a) { return Object.assign({ id: 'alert-' + (++self.alertIdCounter) }, a); });
      this.setState({ alerts: (this.state.alerts || []).concat(withIds) });
      withIds.forEach(function (a) {
        setTimeout(function () {
          self.setState({ alerts: (self.state.alerts || []).filter(function (x) { return x.id !== a.id; }) });
        }, 7000);

  App.prototype.startVoiceInput = function (targetField) {

      });
      return;
    }
    if (this.recognition) { try { this.recognition.stop(); } catch (e) {} }
    var recog = new SR();
    recog.lang = 'ar-SA';
    recog.interimResults = false;
    recog.maxAlternatives = 1;
    this.recognition = recog;
    this.setState({ voiceListeningFor: targetField });
    recog.onresult = function (event) {
      var transcript = (event.results && event.results[0] && event.results[0][0] && event.results[0][0].transcript) || '';
      if (targetField === 'search') {
        self.setState({ search: transcript, voiceListeningFor: null });
      } else if (targetField === 'doctor') {
        self.setFormField('name', transcript);
        self.setState({ voiceListeningFor: null });
      } else if (targetField === 'patient') {
        self.setFormField('patient', transcript);
        self.setState({ voiceListeningFor: null });
      }
    };
    recog.onerror = function () { self.setState({ voiceListeningFor: null }); };
    recog.onend = function () { if (self.state.voiceListeningFor === targetField) self.setState({ voiceListeningFor: null }); };

  App.prototype.saveCase = function () {
    var f = this.state.form;
    var today = new Date().toISOString().slice(0, 10);
    var paidNum = Number(f.paid) || 0;
    var totalNum = Number(f.total) || 0;

    if (this.state.editingCaseId) {
      var sources = {
        late: this.lateRows, inprogress: this.progressRows, completed: this.completedRows,
        delivered: this.deliveredRows, pending: this.pendingRows
      };
      var oldStatus = this.state.editingCaseStatus;
      var oldId = this.state.editingCaseId;
      var oldArr = sources[oldStatus];
      var idx = oldArr ? oldArr.findIndex(function (r) { return r.id === oldId; }) : -1;
      var existing = idx !== -1 ? oldArr[idx] : {};
      if (idx !== -1) oldArr.splice(idx, 1);

      var updated = Object.assign({}, existing, {
        id: oldId,
        doctor: f.name.trim() || '—',
        clinic: existing.clinic || '—',
        patient: f.patient.trim() || '—',

        caseType: f.material,

        total: totalNum,
        orderDate: f.orderDate || today,

        updated.completedDate = updated.completedDate || today;

        updated.notes = updated.notes || '—';

      sources[newStatus].unshift(updated);

      this.setState({ modalOpen: false, editingCaseId: null, editingCaseStatus: null, selected: newStatus, search: '' });
      this.checkAlerts();
      return;

    this.idCounter += 1;
    var base = {
      id: 'case-' + this.idCounter,
      doctor: f.name.trim() || '—',
      clinic: '—',
      patient: f.patient.trim() || '—',
      material: f.material,
      paid: paidNum,
      total: totalNum,
      orderDate: f.orderDate || today,
      dueDate: f.dueDate || ''
    };
    if (f.status === 'late') {
      this.lateRows.unshift(Object.assign({ caseType: f.material, expected: today, late: '—' }, base));
    } else if (f.status === 'inprogress') {
      this.progressRows.unshift(Object.assign({ caseType: f.material, stage: 'قيد المعالجة', progress: 10, progressText: '10%', expected: today }, base));
    } else if (f.status === 'completed') {
      this.completedRows.unshift(Object.assign({ caseType: f.material, completedDate: today }, base));
    } else if (f.status === 'delivered') {
      this.deliveredRows.unshift(Object.assign({ deliveredDate: today }, base));
    } else if (f.status === 'pending') {
      this.pendingRows.unshift(Object.assign({ readyDate: today, notes: '—' }, base));
    }
    this.saveData();
    this.setState({ modalOpen: false, selected: f.status, search: '' });
    this.checkAlerts();
  };

  App.prototype.toggleStatusMenu = function (rowId) {
    this.setState({ statusMenuFor: this.state.statusMenuFor === rowId ? null : rowId });
  };
  App.prototype.closeStatusMenu = function () { this.setState({ statusMenuFor: null }); };

  App.prototype.moveCase = function (rowId, fromId, toId) {
    var sources = {
      late: this.lateRows, inprogress: this.progressRows, completed: this.completedRows,
      delivered: this.deliveredRows, pending: this.pendingRows
    };
    var fromArr = sources[fromId];
    var idx = fromArr.findIndex(function (r) { return r.id === rowId; });
    if (idx === -1) { this.setState({ statusMenuFor: null }); return; }
    var row = Object.assign({}, fromArr[idx]);
    fromArr.splice(idx, 1);
    var today = new Date().toISOString().slice(0, 10);
    if (toId === 'late') {
      row.expected = row.expected || today;
      row.late = row.late || '—';
    } else if (toId === 'inprogress') {
      row.stage = row.stage || 'قيد المعالجة';
      row.progress = row.progress != null ? row.progress : 50;
      row.progressText = row.progressText || (row.progress + '%');
      row.expected = row.expected || today;
    } else if (toId === 'completed') {
      row.completedDate = today;
    } else if (toId === 'delivered') {
      row.deliveredDate = today;
    } else if (toId === 'pending') {
      row.readyDate = today;
      row.notes = row.notes || '—';
    }
    sources[toId].unshift(row);
    this.saveData();
    this.setState({ statusMenuFor: null, selected: toId, search: '' });
    this.checkAlerts();
  };

  App.prototype.setPayment = function (rowId, statusId, newPaid) {
    var sources = {
      late: this.lateRows, inprogress: this.progressRows, completed: this.completedRows,
      delivered: this.deliveredRows, pending: this.pendingRows
    };
    var arr = sources[statusId];
    var row = arr && arr.find(function (r) { return r.id === rowId; });
    if (row) row.paid = newPaid;
    this.saveData();
    this.setState({ statusMenuFor: null });
  };

  /* ---------- Materials ---------- */

  App.prototype.openMaterialModal = function (editId) {
    if (editId) {
      var m = this.materialsRows.find(function (r) { return r.id === editId; });
      if (!m) return;
      this.setState({
        materialsModalOpen: true, materialEditingId: editId, materialsMenuFor: null,
        materialForm: { name: m.name, qty: String(m.qty), price: String(m.price), purchaseDate: m.purchaseDate || '' }
      });
    } else {
      var today = new Date().toISOString().slice(0, 10);
      this.setState({
        materialsModalOpen: true, materialEditingId: null, materialsMenuFor: null,
        materialForm: { name: '', qty: '', price: '', purchaseDate: today }
      });
    }
  };

  App.prototype.closeMaterialModal = function () { this.setState({ materialsModalOpen: false, materialEditingId: null }); };

  App.prototype.setMaterialField = function (key, value) {
    var mf = Object.assign({}, this.state.materialForm);
    mf[key] = value;
    this.setState({ materialForm: mf });
  };

  App.prototype.saveMaterial = function () {
    var f = this.state.materialForm;
    var qtyNum = Number(f.qty) || 0;
    var priceNum = Number(f.price) || 0;
    var today = new Date().toISOString().slice(0, 10);
    if (this.state.materialEditingId) {
      var m = this.materialsRows.find(function (r) { return r.id === this.state.materialEditingId; }.bind(this));
      if (m) {
        m.name = f.name.trim() || m.name;
        m.qty = qtyNum;
        m.price = priceNum;
        m.purchaseDate = f.purchaseDate || m.purchaseDate;
      }
    } else {
      this.materialsIdCounter += 1;
      this.materialsRows.unshift({
        id: 'mat-' + this.materialsIdCounter,
        name: f.name.trim() || '—',
        qty: qtyNum,
        price: priceNum,
        purchaseDate: f.purchaseDate || today
      });
    }
    this.saveData();
    this.setState({ materialsModalOpen: false, materialEditingId: null, selected: 'materials', search: '' });
    this.checkAlerts();
  };

  App.prototype.toggleMaterialMenu = function (rowId) {
    this.setState({ materialsMenuFor: this.state.materialsMenuFor === rowId ? null : rowId });
  };
  App.prototype.closeMaterialMenu = function () { this.setState({ materialsMenuFor: null }); };

  App.prototype.deleteMaterial = function (rowId) {
    var idx = this.materialsRows.findIndex(function (r) { return r.id === rowId; });
    if (idx !== -1) this.materialsRows.splice(idx, 1);
    this.saveData();
    this.setState({ materialsMenuFor: null });
  };

  /* ---------- CSV export ---------- */

  App.prototype.csvEscape = function (value) {
    var str = value === null || value === undefined ? '' : String(value);
    return '"' + str.replace(/"/g, '""') + '"';
  };

  App.prototype.buildBackupCsv = function () {
    var sources = {
      late: this.lateRows, inprogress: this.progressRows, completed: this.completedRows,
      delivered: this.deliveredRows, pending: this.pendingRows
    };
    var STATUS_LABELS = {
      late: 'متأخرة', inprogress: 'قيد الإنتاج', completed: 'مكتملة', delivered: 'تم تسليمها', pending: 'بانتظار التسليم'
    };
    var allCaseRows = [];
    var debtRows = [];
    var self = this;
    Object.keys(sources).forEach(function (statusId) {
      sources[statusId].forEach(function (r) {
        var total = Number(r.total) || 0;
        var paid = Number(r.paid) || 0;
        var remaining = Math.max(0, total - paid);
        allCaseRows.push([
          r.doctor || '—', r.patient || '—', r.caseType || r.material || '—',
          STATUS_LABELS[statusId] || statusId, r.orderDate || '—', r.dueDate || r.expected || '—',
          total, paid, remaining
        ]);
        if (total > paid) {
          debtRows.push([r.doctor || '—', r.patient || '—', STATUS_LABELS[statusId] || statusId, total, paid, remaining]);
        }
      });
    });

    var rows = [];
    rows.push(['نسخة احتياطية — Esthetic Universe', new Date().toISOString().slice(0, 10)]);
    rows.push([]);

    rows.push(['جدول الحالات']);
    rows.push(['اسم الطبيب / العيادة', 'اسم المريض', 'نوع العمل', 'حالة الطلب', 'تاريخ الاستلام', 'تاريخ التسليم المتوقع', 'المبلغ الإجمالي', 'المبلغ المدفوع', 'المبلغ المتبقي']);
    if (allCaseRows.length === 0) { rows.push(['لا توجد حالات مسجلة']); } else { allCaseRows.forEach(function (r) { rows.push(r); }); }
    rows.push([]);

    rows.push(['الديون والمستحقات']);
    rows.push(['اسم الطبيب / العيادة', 'اسم المريض', 'حالة الطلب', 'المبلغ الإجمالي', 'المبلغ المدفوع', 'المبلغ المتبقي']);
    if (debtRows.length === 0) { rows.push(['لا توجد ديون أو مستحقات حالياً']); } else { debtRows.forEach(function (r) { rows.push(r); }); }
    rows.push([]);

    rows.push(['المخزون والمواد']);
    rows.push(['اسم المادة', 'الكمية المتوفرة', 'سعر الشراء', 'تاريخ الشراء']);
    if (this.materialsRows.length === 0) {
      rows.push(['لا توجد مواد مسجلة']);
    } else {
      this.materialsRows.forEach(function (m) { rows.push([m.name || '—', Number(m.qty) || 0, Number(m.price) || 0, m.purchaseDate || '—']); });
    }
    rows.push([]);

    var allRows = [].concat(this.lateRows, this.progressRows, this.completedRows, this.deliveredRows, this.pendingRows);
    var totalPaid = allRows.reduce(function (a, r) { return a + (Number(r.paid) || 0); }, 0);
    var totalDebt = allRows.reduce(function (a, r) { return a + Math.max(0, (Number(r.total) || 0) - (Number(r.paid) || 0)); }, 0);
    var totalMaterialsSpend = this.materialsRows.reduce(function (a, m) { return a + (Number(m.price) || 0); }, 0);
    rows.push(['ملخص مالي']);
    rows.push(['البند', 'القيمة (د.ع)']);
    rows.push(['الأرباح الإجمالية (المدفوع فعلياً)', totalPaid]);
    rows.push(['إجمالي الديون والمستحقات', totalDebt]);
    rows.push(['إجمالي مصاريف المواد', totalMaterialsSpend]);

    var csvLines = rows.map(function (row) { return row.map(function (cell) { return self.csvEscape(cell); }).join(','); });
    return '\uFEFF' + csvLines.join('\r\n');
  };

  App.prototype.exportBackup = function () {
    try {
      var csv = this.buildBackupCsv();
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var today = new Date().toISOString().slice(0, 10);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'EstheticUniverse_Backup_' + today + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {}
  };

  /* ---------- Event delegation ---------- */

  App.prototype.handleInput = function (e) {
    var el = e.target.closest('[data-bind]');
    if (!el) return;
    var path = el.getAttribute('data-bind');
    var value = el.value;
    if (path.indexOf('.') === -1) {
      var patch = {};
      patch[path] = value;
      this.setState(patch);
    } else {
      var parts = path.split('.');
      var obj = Object.assign({}, this.state[parts[0]]);
      obj[parts[1]] = value;
      var patch2 = {};
      patch2[parts[0]] = obj;
      this.setState(patch2);
    }
  };

  App.prototype.handleClick = function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var rowId = el.getAttribute('data-row');
    var value = el.getAttribute('data-value');
    var id = el.getAttribute('data-id');
    var sel = this.state.selected;

    switch (action) {
      case 'select': this.select(value); break;
      case 'clear-selection': this.select(null); break;

      case 'open-modal': this.openModal(); break;
      case 'close-modal': this.closeModal(); break;
      case 'save-case': this.saveCase(); break;

      case 'toggle-material-dropdown': this.toggleDropdown('material'); break;
      case 'toggle-status-dropdown': this.toggleDropdown('status'); break;
      case 'close-dropdowns': this.closeDropdowns(); break;
      case 'pick-material-option': this.setFormField('material', value); break;
      case 'pick-status-option': this.setFormField('status', value); break;

      case 'search-mic-click':
        this.state.voiceListeningFor === 'search' ? this.stopVoiceInput() : this.startVoiceInput('search');
        break;
      case 'doctor-mic-click':
        this.state.voiceListeningFor === 'doctor' ? this.stopVoiceInput() : this.startVoiceInput('doctor');
        break;
      case 'patient-mic-click':
        this.state.voiceListeningFor === 'patient' ? this.stopVoiceInput() : this.startVoiceInput('patient');
        break;

      case 'toggle-status-menu': this.toggleStatusMenu(rowId); break;
      case 'close-status-menu': this.closeStatusMenu(); break;
      case 'edit-case': this.openEditModal(rowId, sel); break;
      case 'move-case': this.moveCase(rowId, sel, value); break;
      case 'mark-paid': {
        var rowP = this.findCaseRow(sel, rowId);
        var totalAmt = rowP ? (Number(rowP.total) || 0) : 0;
        var paidAmt = rowP ? (Number(rowP.paid) || 0) : 0;
        this.setPayment(rowId, sel, totalAmt || paidAmt || 0);
        break;
      }
      case 'mark-unpaid': this.setPayment(rowId, sel, 0); break;

      case 'open-material-modal': this.openMaterialModal(id || null); break;
      case 'close-material-modal': this.closeMaterialModal(); break;
      case 'save-material': this.saveMaterial(); break;
      case 'toggle-material-menu': this.toggleMaterialMenu(id); break;
      case 'close-material-menu': this.closeMaterialMenu(); break;
      case 'edit-material': this.openMaterialModal(id); break;
      case 'delete-material': this.deleteMaterial(id); break;

      case 'dismiss-alert': this.dismissAlert(id); break;
      case 'export-backup': this.exportBackup(); break;

      case 'install-click': this.installClick(); break;
      case 'dismiss-install-banner': this.dismissInstallBanner(); break;
      case 'close-install-instructions': this.closeInstallInstructions(); break;
    }
  };

  App.prototype.findCaseRow = function (statusId, rowId) {
    var sources = {
      late: this.lateRows, inprogress: this.progressRows, completed: this.completedRows,
      delivered: this.deliveredRows, pending: this.pendingRows
    };
    var arr = sources[statusId];
    return arr && arr.find(function (r) { return r.id === rowId; });
  };

  /* ---------- Focus preservation ---------- */

  App.prototype.captureFocus = function () {
    var active = document.activeElement;
    if (!active || !this.root.contains(active)) return null;
    var bindPath = active.getAttribute && active.getAttribute('data-bind');
    if (!bindPath) return null;
    return {
      bindPath: bindPath,
      selectionStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
      selectionEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null
    };
  };

  App.prototype.restoreFocus = function (focus) {
    if (!focus) return;
    var el = this.root.querySelector('[data-bind="' + focus.bindPath + '"]');
    if (!el) return;
    el.focus();
    if (focus.selectionStart !== null && el.setSelectionRange) {
      try { el.setSelectionRange(focus.selectionStart, focus.selectionEnd); } catch (e) {}
    }
  };

  /* ---------- Computed values ---------- */

  App.prototype.computeVals = function () {
    var self = this;
    var search = (this.state.search || '').trim();
    var sel = this.state.selected;
    var now = new Date();
    var dateStr = '';
    try {
      dateStr = now.toLocaleDateString('ar-u-ca-gregory-nu-latn', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    } catch (e) { dateStr = now.toLocaleDateString(); }
    var todayStr = now.toISOString().slice(0, 10);

    function match(row, fields) {
      return !search || fields.some(function (f) { return (row[f] || '').indexOf(search) !== -1; });
    }
    function fmt(n) { return n.toLocaleString('en-US') + ' د.ع'; }
    function fmtQty(n) { return n.toLocaleString('en-US'); }

    var lateRowsFiltered = this.lateRows.filter(function (r) { return match(r, ['doctor', 'clinic']); });
    var progressRowsFiltered = this.progressRows.filter(function (r) { return match(r, ['doctor', 'clinic']); });
    var completedRowsFiltered = this.completedRows.filter(function (r) { return match(r, ['doctor', 'clinic']); });
    var deliveredRowsFiltered = this.deliveredRows.filter(function (r) { return match(r, ['doctor', 'clinic']); });
    var pendingRowsFiltered = this.pendingRows.filter(function (r) { return match(r, ['doctor', 'clinic']); });

    var materialsNormalized = this.materialsRows.map(function (m) {
      return {
        id: m.id,
        name: m.name,
        qtyText: fmtQty(Number(m.qty) || 0),
        priceText: fmt(Number(m.price) || 0),
        purchaseDate: m.purchaseDate || '—',
        menuOpen: self.state.materialsMenuFor === m.id
      };
    });
    var materialsRowsFiltered = materialsNormalized.filter(function (r) { return match(r, ['name']); });
    var materialsTotalSpend = this.materialsRows.reduce(function (a, m) { return a + (Number(m.price) || 0); }, 0);

    var CASE_SOURCES = {
      late: this.lateRows, inprogress: this.progressRows, completed: this.completedRows,
      delivered: this.deliveredRows, pending: this.pendingRows
    };
    var isCaseCategory = !!STATUS_META[sel];
    var activeRowsFiltered = [];
    var activeEmptyNoData = false;
    var activeEmptyWithSearch = false;
    if (isCaseCategory) {
      var meta = STATUS_META[sel];
      var sourceRows = CASE_SOURCES[sel];
      var normalized = sourceRows.map(function (r) {
        var paidAmt = Number(r.paid) || 0;
        var totalAmt = Number(r.total) || 0;
        var fullyPaid = totalAmt <= paidAmt;
        var dueDateVal = r.dueDate || r.expected || '';
        var isOverdue = sel !== 'delivered' && !!dueDateVal && dueDateVal < todayStr;
        return {
          id: r.id,
          doctor: r.doctor,
          patient: r.patient,
          workType: r.caseType || r.material || '—',
          deliveryDate: dueDateVal || r.completedDate || r.deliveredDate || r.readyDate || '—',
          isOverdue: isOverdue,
          dateColor: isOverdue ? '#f87171' : '#c3cde3',
          statusLabel: meta.label,
          statusColor: meta.color,
          statusBg: meta.bg,
          isFullyPaid: fullyPaid,
          paidOptionBg: fullyPaid ? 'rgba(53,197,201,0.14)' : 'transparent',
          unpaidOptionBg: !fullyPaid ? 'rgba(53,197,201,0.14)' : 'transparent',
          menuOpen: self.state.statusMenuFor === r.id,
          otherStatuses: Object.keys(STATUS_META).filter(function (id) { return id !== sel; }).map(function (id) {
            return { label: STATUS_META[id].label, dot: STATUS_META[id].color, id: id };
          })
        };
      });
      activeRowsFiltered = normalized.filter(function (r) {
        return !search || (r.doctor || '').indexOf(search) !== -1 || (r.patient || '').indexOf(search) !== -1;
      });
      activeEmptyNoData = sourceRows.length === 0;
      activeEmptyWithSearch = !activeEmptyNoData && activeRowsFiltered.length === 0;
    }

    var allCaseEntries = [];
    Object.keys(CASE_SOURCES).forEach(function (id) {
      CASE_SOURCES[id].forEach(function (r) { allCaseEntries.push({ statusId: id, row: r }); });
    });
    var overdueCount = allCaseEntries.filter(function (e) {
      var d = e.row.dueDate || e.row.expected || '';
      return e.statusId !== 'delivered' && !!d && d < todayStr;
    }).length;
    var totalPaid = allCaseEntries.reduce(function (a, e) { return a + (Number(e.row.paid) || 0); }, 0);
    var debtEntries = allCaseEntries.filter(function (e) { return (Number(e.row.total) || 0) > (Number(e.row.paid) || 0); });
    var totalDebt = debtEntries.reduce(function (a, e) { return a + ((Number(e.row.total) || 0) - (Number(e.row.paid) || 0)); }, 0);
    var paidEntries = allCaseEntries.filter(function (e) { return (Number(e.row.paid) || 0) > 0; });
    var profitsSourceRows = paidEntries.map(function (e) {
      return {
        doctor: e.row.doctor, clinic: e.row.clinic, patient: e.row.patient,
        paidText: fmt(Number(e.row.paid) || 0),
        statusLabel: STATUS_META[e.statusId].label, statusColor: STATUS_META[e.statusId].color, statusBg: STATUS_META[e.statusId].bg
      };
    });
    var debtsSourceRows = debtEntries.map(function (e) {
      return {
        doctor: e.row.doctor, clinic: e.row.clinic, patient: e.row.patient,
        remainingText: fmt((Number(e.row.total) || 0) - (Number(e.row.paid) || 0)),
        statusLabel: STATUS_META[e.statusId].label, statusColor: STATUS_META[e.statusId].color, statusBg: STATUS_META[e.statusId].bg
      };
    });
    var profitsRowsFiltered = profitsSourceRows.filter(function (r) { return match(r, ['doctor', 'clinic', 'patient']); });
    var debtsRowsFiltered = debtsSourceRows.filter(function (r) { return match(r, ['doctor', 'clinic', 'patient']); });

    function border(id, color) { return sel === id ? color : 'rgba(255,255,255,0.09)'; }
    function bg(id, tint) { return sel === id ? tint : 'rgba(255,255,255,0.045)'; }

    var totals = {
      late: [this.lateRows.length, lateRowsFiltered.length],
      inprogress: [this.progressRows.length, progressRowsFiltered.length],
      completed: [this.completedRows.length, completedRowsFiltered.length],
      delivered: [this.deliveredRows.length, deliveredRowsFiltered.length],
      pending: [this.pendingRows.length, pendingRowsFiltered.length],
      profits: [profitsSourceRows.length, profitsRowsFiltered.length],
      debts: [debtsSourceRows.length, debtsRowsFiltered.length],
      materials: [this.materialsRows.length, materialsRowsFiltered.length]
    };
    var t = totals[sel] || [0, 0];
    var detailsMeta = t[0] ? (search ? (t[1] + ' من ' + t[0] + ' سجل') : (t[0] + ' سجل')) : '';

    return {
      dateStr: dateStr,
      searchValue: this.state.search || '',

      lateBorder: border('late', COLORS.late), lateBg: bg('late', 'rgba(248,113,113,0.10)'), lateCount: this.lateRows.length,
      overdueCount: overdueCount, hasOverdue: overdueCount > 0,
      progressBorder: border('inprogress', COLORS.inprogress), progressBg: bg('inprogress', 'rgba(251,191,36,0.10)'), progressCount: this.progressRows.length,
      completedBorder: border('completed', COLORS.completed), completedBg: bg('completed', 'rgba(46,198,198,0.10)'), completedCount: this.completedRows.length,
      deliveredBorder: border('delivered', COLORS.delivered), deliveredBg: bg('delivered', 'rgba(74,222,128,0.10)'), deliveredCount: this.deliveredRows.length,
      pendingBorder: border('pending', COLORS.pending), pendingBg: bg('pending', 'rgba(167,139,250,0.10)'), pendingCount: this.pendingRows.length,

      profitsBorder: border('profits', COLORS.profits), profitsBg: bg('profits', 'rgba(74,222,128,0.10)'), profitsTotal: fmt(totalPaid), profitsCasesCount: profitsSourceRows.length,
      debtsBorder: border('debts', COLORS.debts), debtsBg: bg('debts', 'rgba(249,115,22,0.10)'), debtsTotal: fmt(totalDebt), debtsClinicsCount: debtsSourceRows.length,
      materialsBorder: border('materials', COLORS.materials), materialsBg: bg('materials', 'rgba(96,165,250,0.10)'), materialsTotal: fmt(materialsTotalSpend), materialsCount: this.materialsRows.length,

      hasSelection: !!sel, noSelection: !sel,

      modalOpen: !!this.state.modalOpen,
      isEditingCase: !!this.state.editingCaseId,
      caseModalTitle: this.state.editingCaseId ? 'تعديل بيانات الحالة' : 'إضافة حالة جديدة',
      caseSaveLabel: this.state.editingCaseId ? 'حفظ التعديلات' : 'حفظ',
      formName: this.state.form.name,
      formPatient: this.state.form.patient,
      formMaterial: this.state.form.material,
      formStatusLabel: (STATUS_META[this.state.form.status] || {}).label || '',
      formStatusColor: (STATUS_META[this.state.form.status] || {}).color || '#35c5c9',

      materialDropdownOpen: this.state.openDropdown === 'material',
      statusDropdownOpen: this.state.openDropdown === 'status',
      materialChevron: this.state.openDropdown === 'material' ? 'rotate(180deg)' : 'rotate(0deg)',
      statusChevron: this.state.openDropdown === 'status' ? 'rotate(180deg)' : 'rotate(0deg)',
      materialOptions: MATERIAL_LIST.map(function (label) {
        return {
          label: label, selected: self.state.form.material === label,
          bg: self.state.form.material === label ? 'rgba(53,197,201,0.14)' : 'transparent',
          weight: self.state.form.material === label ? 700 : 500
        };
      }),

      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">تاريخ الاستلام</span>'
      + '<input type="date" data-bind="form.orderDate" value="' + escHtml(v.formOrderDate) + '" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px; color-scheme: dark;"></label>'
      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">تاريخ التسليم المتوقع</span>'
      + '<input type="date" data-bind="form.dueDate" value="' + escHtml(v.formDueDate) + '" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px; color-scheme: dark;"></label>'
      + '</div>'

      + '<div class="eu-form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">'
      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">المبلغ الإجمالي (د.ع)</span>'
      + '<input type="number" data-bind="form.total" value="' + escHtml(v.formTotal) + '" placeholder="0" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px;"></label>'
      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">المبلغ المدفوع (د.ع)</span>'
      + '<input type="number" data-bind="form.paid" value="' + escHtml(v.formPaid) + '" placeholder="0" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px;"></label>'
      + '</div>'

      + '</div>'

      + '<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 24px;">'
      + '<button data-action="close-modal" style="all: unset; cursor: pointer; padding: 12px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); color: #c3cde3; font-weight: 600; font-size: 14px;">إلغاء</button>'
      + '<button data-action="save-case" style="all: unset; cursor: pointer; padding: 12px 26px; border-radius: 10px; background: linear-gradient(135deg, #35c5c9, #2196a3); color: #04141a; font-weight: 700; font-size: 14px; box-shadow: 0 8px 24px rgba(53,197,201,0.3);">' + escHtml(v.caseSaveLabel) + '</button>'
      + '</div></div></div>';
  };

  App.prototype.renderMaterialModal = function (v) {
    return '<div style="position: fixed; inset: 0; background: rgba(2,4,10,0.72); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px;">'
      + '<div class="eu-modal-box" style="width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; border-radius: 20px; background: #0b1220; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 80px rgba(0,0,0,0.5); padding: 26px;">'
      + '<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;">'
      + '<span style="font-size: 17px; font-weight: 700; color: #f5f8fc;">' + escHtml(v.materialModalTitle) + '</span>'
      + '<button data-action="close-material-modal" aria-label="إغلاق" class="eu-close" style="all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #93a0bb;">' + ICON_CLOSE + '</button></div>'

      + '<div style="display: flex; flex-direction: column; gap: 16px;">'
      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">اسم المادة</span>'
      + '<input type="text" data-bind="materialForm.name" value="' + escHtml(v.materialFormName) + '" placeholder="مثال: كتل زركون" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px;"></label>'

      + '<div class="eu-form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">'
      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">الكمية</span>'
      + '<input type="number" data-bind="materialForm.qty" value="' + escHtml(v.materialFormQty) + '" placeholder="0" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px;"></label>'
      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">سعر الشراء (د.ع)</span>'
      + '<input type="number" data-bind="materialForm.price" value="' + escHtml(v.materialFormPrice) + '" placeholder="0" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px;"></label>'
      + '</div>'

      + '<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 600; color: #93a0bb;">تاريخ الشراء</span>'
      + '<input type="date" data-bind="materialForm.purchaseDate" value="' + escHtml(v.materialFormDate) + '" style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #eef1f8; font-family: inherit; font-size: 14px; color-scheme: dark;"></label>'
      + '</div>'

      + '<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 24px;">'
      + '<button data-action="close-material-modal" style="all: unset; cursor: pointer; padding: 12px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); color: #c3cde3; font-weight: 600; font-size: 14px;">إلغاء</button>'
      + '<button data-action="save-material" style="all: unset; cursor: pointer; padding: 12px 26px; border-radius: 10px; background: linear-gradient(135deg, #35c5c9, #2196a3); color: #04141a; font-weight: 700; font-size: 14px; box-shadow: 0 8px 24px rgba(53,197,201,0.3);">حفظ</button>'
      + '</div></div></div>';
  };

  var app = new App();
  app.mount();
  window.__eu_app = app;

  /* ---------- Landing <-> Dashboard view switch (single-file, no page navigation) ---------- */
  var landingView = document.getElementById('landingView');
  var dashboardView = document.getElementById('dashboardView');
  var enterBtn = document.getElementById('enterAppBtn');

  function showDashboard() {
    landingView.classList.add('eu-hidden');
    dashboardView.classList.remove('eu-hidden');
    try { window.location.hash = 'dashboard'; } catch (e) {}
  }

  if (enterBtn) {
    enterBtn.addEventListener('click', showDashboard);
  }
  if (window.location.hash === '#dashboard') {
    showDashboard();
  }
})();
</script>
</body>
</html>
